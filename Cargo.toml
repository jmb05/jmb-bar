[package]
name = "jmb-bar"
version = "0.1.0"
edition = "2024"

[dependencies]
grass = "0.13.4"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_24"] }
gtk4-layer-shell = "0.8.1"
hyprland = { git = "https://github.com/romanstingler/hyprland-rs-next", branch = "master" }
notify = "8.2.0"
glib = "0.22.10"
mpris = "2.1.0"
time-format = "1.2.4"
nmrs = "3.5.7"
tokio = { version = "1.53.3", features = ["rt", "time", "net", "sync", "rt-multi-thread", "io-util", "macros"] }
futures-util = "0.3"
serde_json = "1.0.154"
crossbeam-channel = "0.5.17"
jmb-logger-rs = { git = "https://github.com/jmb05/jmb-logger-rs" }
sysinfo = "0.39.6"
all-smi = "0.28.1"
rustsni = "0.2.2"
thiserror = "2.0.21"
pulse = { package = "libpulse-binding", version = "2.30" }
eventfd = "0.2.0"
libc = "0.2.191"
http = "1.5.0"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version =  "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
brightness = { version = "0.8.0", features = ["blocking"] }
battery = "0.7.8"
ddc-hi = { version =  "0.4.1", features = ["ddc-i2c"] }

[build-dependencies]
glib-build-tools = "0.22.8"
